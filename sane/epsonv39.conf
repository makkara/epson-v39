# epsonv39 backend: EPSON Perfection V39 / GT-S650 (USB 04b8:013d)
#
# The scanner has no firmware in flash; the backend uploads Epson's
# esfw010c.bin after every power-on.  If this line is missing, the backend
# looks in $XDG_DATA_HOME/sane/epsonv39/, ~/.local/share/sane/epsonv39/,
# /usr/share/sane/epsonv39/ and /usr/share/iscan/.
#firmware /usr/share/sane/epsonv39/esfw010c.bin
